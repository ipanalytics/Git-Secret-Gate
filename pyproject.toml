[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git-secret-gate"
version = "0.1.0"
description = "Stop secrets and destructive commands before they leave the machine: a pre-commit and pre-push gate with its own rules, a policy file and no network."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ipanalytics" }]
keywords = ["git", "hooks", "secret-scanning", "pre-commit", "security", "ci"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
secret-gate = "git_secret_gate.cli:main"

[tool.setuptools.packages.find]
include = ["git_secret_gate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
